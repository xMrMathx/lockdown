      const items = [];
      BLOCKS.forEach(function(b, i){
        if (!b.open) items.push(['Reopen Cell Block ' + b.name, '+60 capacity', '$8,000', function(){ W.reopenBlock(i); }]);
      });
      const fc = sim.fence === 1 ? '$5,000' : sim.fence === 2 ? '$12,000' : null;
      items.push(['Perimeter Fence → Level ' + Math.min(3, sim.fence+1),
        sim.fence >= 3 ? 'Maximum security' : 'Fewer escapes, less contraband', fc || 'MAX',
        function(){ W.upgradeFence(); }, sim.fence >= 3]);
      const cc = sim.cameras === 0 ? '$4,000' : sim.cameras === 1 ? '$8,000' : null;
      items.push(['Camera Network → Level ' + Math.min(2, sim.cameras+1),
        sim.cameras >= 2 ? 'Full coverage' : 'Spot fights & contraband sooner', cc || 'MAX',
        function(){ W.addCameras(); }, sim.cameras >= 2]);
      items.push(['Reform Programs', sim.programs ? 'Active: classes, counseling, leagues' : 'Calmer inmates, weaker gangs',
        sim.programs ? 'ACTIVE' : '$6,000', function(){ W.addPrograms(); }, sim.programs]);
      showMenu('BUILD', items);
    } else if (name === 'staff'){
      const items = [['Hire Guard', '$500 signing + $200/day wages', '$500', function(){ W.hireGuard(); }]];
      sim.guards.forEach(function(g){
        items.push([g.name, g.downT > 0 ? 'Injured' : 'On duty', 'FIRE', function(){ W.fireGuard(g.id); }]);
      });
      showMenu('STAFF (' + sim.guards.length + ')', items);
    } else if (name === 'actions'){
      const sel = sim.inmates.find(p => p.id === sim.selected);
      const cd = sim.shakedownCd > 0 ? 'Cooldown ' + Math.ceil(sim.shakedownCd/60) + 'h' : 'Ready';
      showMenu('WARDEN ACTIONS', [
        ['Shakedown', 'Seize contraband. Inmates will hate it. (' + cd + ')', 'FREE',
          function(){ W.shakedown(); }, sim.shakedownCd > 0],
        [sim.lockdown ? 'Lift Lockdown' : 'Order Lockdown', 'Everyone to cells. Ends trouble, breeds resentment.', 'FREE',
          function(){ W.toggleLockdown(); }],
        ['Solitary — ' + (sel ? sel.name : 'no one selected'), 'Select an inmate, then isolate 24h', 'FREE',
          function(){ if (sel) W.solitary(sel.id); }, !sel],
        ['Transfer — ' + (sel ? sel.name : 'no one selected'), 'Remove a problem inmate for good', '$500',
          function(){ if (sel){ W.transfer(sel.id); closeProfile(); } }, !sel],
      ]);
    } else if (name === 'reports'){
      showMenu('REPORTS', []);
      reportsTab('inmates');
    }
  }
  function reportsTab(tab){
    const tabs = '<div class="tabs">' +
      ['inmates','gangs','log'].map(function(t){
        return '<div class="tab' + (t===tab?' on':'') + '" data-t="'+t+'">'+t.toUpperCase()+'</div>';
      }).join('') + '</div>';
    let body = '';
    if (tab === 'inmates'){
      const rows = sim.inmates.slice().sort(function(a,b){ return a.name.localeCompare(b.name); });
      body = rows.map(function(p){
        const g = p.gangId ? sim.gangs.find(x => x.id===p.gangId) : null;
        return '<div class="rrow" data-id="'+p.id+'"><span class="dot" style="background:'+(g?g.color:'#e8722a')+'"></span>' +
          '<span class="nm">'+p.name+'</span><span class="st">'+zoneOf(p.x,p.y)+(p.solitaryT>0?' • SOLITARY':'')+'</span></div>';
      }).join('') || '<div class="logrow">No inmates.</div>';
    } else if (tab === 'gangs'){
      body = sim.gangs.map(function(g){
        const lead = sim.inmates.find(p => p.id===g.leader);
        return '<div class="rrow"><span class="dot" style="background:'+g.color+'"></span>' +
          '<span class="nm">'+g.name+'</span><span class="st">'+g.members.length+' members' +
          (lead ? ' • '+lead.name.split(' ')[0] : '') + '</span></div>';
      }).join('') || '<div class="logrow">No gangs yet. Watch the yard.</div>';
      body += '<div class="logrow"><span class="lt">TENSION</span>' + Math.round(sim.gangTension*100) + '%</div>';
    } else {
      body = sim.log.map(function(l){
        return '<div class="logrow"><span class="lt">D'+l.day+' '+l.time+'</span>'+l.msg+'</div>';
      }).join('');
    }
    menuEl.innerHTML = '<button class="mclose" id="mclose">✕</button><h3>REPORTS</h3>' + tabs + body;
    document.getElementById('mclose').onclick = closeMenu;
    menuEl.querySelectorAll('.tab').forEach(function(t){ t.onclick = function(){ reportsTab(t.getAttribute('data-t')); }; });
    menuEl.querySelectorAll('.rrow[data-id]').forEach(function(r){
      r.onclick = function(){
        const p = sim.inmates.find(x => x.id === Number(r.getAttribute('data-id')));
        if (p){ closeMenu(); openProfile(p); }
      };
    });
  }

  // ---- profile card ----
  const profEl = document.getElementById('profile');
  function needBar(label, v){
    const c = v > 0.6 ? '#7fd069' : v > 0.35 ? '#f5b942' : '#e05252';
    return '<div class="needrow"><span class="nl">'+label+'</span><div class="needbar"><div class="needfill" style="width:'+
      Math.round(v*100)+'%;background:'+c+'"></div></div></div>';
  }
  function openProfile(p){
    sim.selected = p.id;
    const g = p.gangId ? sim.gangs.find(x => x.id===p.gangId) : null;
    let h = '<button class="mclose" id="pclose">✕</button>';
    h += '<h2>'+p.name+'</h2><div class="sub">' + p.crime + ' • ' + p.sentence + ' yrs' +
      (p.solitaryT>0 ? ' • <b style="color:#e05252">SOLITARY</b>' : '') + '</div>';
    h += '<div class="chips">';
    p.traits.forEach(function(t){ h += '<span class="chip">'+t+'</span>'; });
    if (g) h += '<span class="chip gang">'+g.name+'</span>';
    else if (p.affil) h += '<span class="chip">'+p.affil.name+' (unaffiliated)</span>';
    if (p.contra) h += '<span class="chip" style="border:1px solid #e05252;color:#ffb3b3">holding: '+p.contra+'</span>';
    h += '</div>';
    h += '<div class="story">“'+p.story+'”</div>';
    h += needBar('Hunger', p.needs.hunger) + needBar('Energy', p.needs.energy) +
         needBar('Comfort', p.needs.comfort) + needBar('Safety', p.needs.safety) +
         needBar('Social', p.needs.social);
    h += '<div class="sub" style="margin-top:10px;margin-bottom:4px"><b>Relationships</b></div>';
    const nm = function(id){ const q = sim.inmates.find(function(r){ return r.id === id; }); return q ? q.name : null; };
    const frNames = p.friends.map(nm).filter(Boolean);
    const talkingNames = Object.keys(p.bond).map(Number).filter(function(k){
      return !p.friends.includes(k) && (p.bond[k] || 0) >= 1 && (p.bond[k] || 0) < 3;
    }).map(nm).filter(Boolean);
    h += '<div class="sub">Friends (' + frNames.length + '): ' + (frNames.join(', ') || '—') + '</div>';
    h += '<div class="sub">Talking to: ' + (talkingNames.join(', ') || '—') + '</div>';
    h += '<div class="sub" style="margin-top:6px">Block ' + BLOCKS[p.block].name + ' • ' + zoneOf(p.x,p.y) + '</div>';
    h += '<div class="pbtns"><button id="psol" class="warn">SOLITARY 24H</button>' +
         '<button id="ptran">TRANSFER $500</button></div>';
    profEl.innerHTML = h;
    profEl.style.display = 'block';
    document.getElementById('pclose').onclick = closeProfile;
    document.getElementById('psol').onclick = function(){ W.solitary(p.id); openProfile(p); };
    document.getElementById('ptran').onclick = function(){ if (W.transfer(p.id)) closeProfile(); };
  }
  function closeProfile(){ profEl.style.display = 'none'; }

  // ---- toolbar ----
  document.getElementById('btn-pause').onclick = function(){ sim.paused = !sim.paused; updateHUD(); };
  document.getElementById('btn-speed').onclick = function(){
    sim.speed = sim.speed === 1 ? 2 : sim.speed === 2 ? 4 : 1; updateHUD();
  };
  document.getElementById('btn-build').onclick = function(){ openMenu('build'); };
  document.getElementById('btn-staff').onclick = function(){ openMenu('staff'); };
  document.getElementById('btn-reports').onclick = function(){ openMenu('reports'); };
  document.getElementById('btn-actions').onclick = function(){ openMenu('actions'); };

  // ---- map gestures: tap-select, drag-pan, pinch-zoom, double-tap reset ----
  // UI panels are HTML overlays and stay fixed while the map moves underneath.
  const pointers = new Map();
  let panState = null;    // {id, sx, sy, lx, ly, moved, t0}
  let pinchState = null;  // {d0, mx, my, zoom0}
  let lastTapT = 0, lastTapX = 0, lastTapY = 0;
  function canvasPos(ev){
    const r = canvas.getBoundingClientRect();
    return { x: ev.clientX - r.left, y: ev.clientY - r.top };   // CSS px
  }
  function selectAt(w){
    const p = inmateAt(w.x, w.y);
    if (p){ openProfile(p); return; }
    let g = null, bd = 20;
    for (const gg of sim.guards){ const d = dist(w.x, w.y, gg.x, gg.y-12); if (d < bd){ bd = d; g = gg; } }
    if (g){ sim.selected = g.id; toast(g.name + ' — on duty.'); closeProfile(); }
    else { sim.selected = null; closeProfile(); }
  }
  function handleTap(ev){
    const p = canvasPos(ev);
    const t = performance.now();
    if (t - lastTapT < 350 && Math.hypot(p.x-lastTapX, p.y-lastTapY) < 30){
      lastTapT = 0;   // double-tap: reset to the default view
      defaultView();
      return;
    }
    lastTapT = t; lastTapX = p.x; lastTapY = p.y;
    selectAt(screenToWorld(p.x, p.y));
  }
  canvas.addEventListener('pointerdown', function(ev){
    try { canvas.setPointerCapture(ev.pointerId); } catch (e) {}
    pointers.set(ev.pointerId, canvasPos(ev));
    if (pointers.size === 1){
      const p = canvasPos(ev);
      panState = { id: ev.pointerId, sx: p.x, sy: p.y, lx: p.x, ly: p.y, moved: false, t0: performance.now() };
    } else if (pointers.size === 2){
      const pts = Array.from(pointers.values());
      pinchState = {
        d0: Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y),
        mx: (pts[0].x+pts[1].x)/2, my: (pts[0].y+pts[1].y)/2,
        zoom0: cam.zoom
      };
      panState = null;   // pinch cancels any tap
    }
  });
  canvas.addEventListener('pointermove', function(ev){
    if (!pointers.has(ev.pointerId)) return;
    const p = canvasPos(ev);
    pointers.set(ev.pointerId, p);
    if (pinchState && pointers.size >= 2){
      const pts = Array.from(pointers.values());
      const d = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      const mx = (pts[0].x+pts[1].x)/2, my = (pts[0].y+pts[1].y)/2;
      if (pinchState.d0 > 4 && d > 4){
        const nz = clamp(pinchState.zoom0 * d/pinchState.d0, 1, 4);
        // keep the image point under the gesture midpoint anchored there
        const s0 = baseScale * cam.zoom;
        const wx = cam.cx + (pinchState.mx*DPR - viewW*DPR/2)/s0;
        const wy = cam.cy + (pinchState.my*DPR - viewH*DPR/2)/s0;
        cam.zoom = nz;
        const s1 = baseScale * nz;
        cam.cx = wx - (mx*DPR - viewW*DPR/2)/s1;
        cam.cy = wy - (my*DPR - viewH*DPR/2)/s1;
        clampCam();
      }
      pinchState.d0 = d; pinchState.mx = mx; pinchState.my = my; pinchState.zoom0 = cam.zoom;
    } else if (panState && ev.pointerId === panState.id){
      if (!panState.moved && Math.hypot(p.x-panState.sx, p.y-panState.sy) > 10) panState.moved = true;
      if (panState.moved){
        const s = baseScale * cam.zoom;
        cam.cx -= (p.x-panState.lx)*DPR/s;
        cam.cy -= (p.y-panState.ly)*DPR/s;
        clampCam();
      }
      panState.lx = p.x; panState.ly = p.y;
    }
  });
  function endPointer(ev){
    const isTap = panState && !panState.moved && (performance.now()-panState.t0) < 400;
    pointers.delete(ev.pointerId);
    if (pinchState && pointers.size < 2) pinchState = null;
    if (panState && ev.pointerId === panState.id){
      if (isTap) handleTap(ev);
      panState = null;
    }
    // one finger left after a pinch: anchor a fresh pan so nothing jumps
    if (pointers.size === 1 && !panState){
      const id = Array.from(pointers.keys())[0], p = pointers.get(id);
      panState = { id: id, sx: p.x, sy: p.y, lx: p.x, ly: p.y, moved: true, t0: performance.now() };
    }
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  // ---- boot ----
  newGame();
  try { // headless QA hook: ?speed=2 / ?speed=4
    const sp = parseInt(new URLSearchParams(location.search).get('speed') || '', 10);
    if (sp === 2 || sp === 4) sim.speed = sp;
  } catch (hq) {}
  buildSprites();
  sizeCanvas();
  defaultView();   // desktop: full map; phone: zoomed-in, screen-filling
  updateHUD();
  let last = performance.now(), acc = 0, frames = 0;
  function frame(now){
    const dtReal = Math.min(0.1, (now - last)/1000); last = now;
    if (!sim.paused) acc += dtReal * 3 * sim.speed;   // 3 game-min per real second at 1x
    let n = 0;
    while (acc >= 1 && n < 600){ tick(1); acc -= 1; n++; }
    if (n >= 600) acc = 0;
    sim.tickFrac = acc;   // 0..1 progress toward the next tick — render interpolates with it
    render(ctx, canvas.width, canvas.height, now/1000);
    if (++frames % 6 === 0) updateHUD();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // test hook: advance the sim the way the frame loop does
  __lockdown.advance = function(dtReal){
    let steps = 0;
    if (!sim.paused){
      let a = dtReal * 3 * sim.speed;
      while (a >= 1 && steps < 200000){ tick(1); a -= 1; steps++; }
    }
    sim.tickFrac = 0;   // tests draw at logical tick positions (deterministic)
    return steps;
  };
  // test hook: camera/view state for gesture + layout verification
  __lockdown.view = function(){
    return { zoom: cam.zoom, cx: cam.cx, cy: cam.cy,
             baseScale: baseScale, dpr: DPR, viewW: viewW, viewH: viewH };
  };
})();
}
</script>
</body>
